<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Paper Flashcard</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>E-Paper Flashcard</h1><p>600 từ vựng • Bluetooth BLE</p></div><span id="status">Chưa kết nối</span></header><section class="card"><small id="counter">1 / 5</small><div id="word">APPLE</div><div id="pron">/ˈæpəl/</div><strong id="meaning">quả táo</strong><i id="example">I eat an apple every day.</i></section><section class="controls"><button id="connect">🔵 Kết nối E-Paper</button><div><button id="prev">← Trước</button><button id="next">Tiếp →</button></div><label>Thời gian <select id="interval"><option value="30000">30 giây</option><option value="60000" selected>1 phút</option><option value="120000">2 phút</option><option value="300000">5 phút</option></select></label><div><button id="start">▶ Bắt đầu</button><button id="pause">⏸ Tạm dừng</button></div></section><p class="note">BLE đã có khung kết nối. UUID/protocol của nRF52 sẽ được thêm sau khi kiểm tra bằng Bluefy.</p></main><script src="app.js"></script></body></html>
