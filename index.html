<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Paper Flashcard</title>
<style>
  body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0;padding:20px;color:#111}
  .wrap{max-width:700px;margin:auto;background:#fff;padding:18px;border-radius:14px}
  h2{margin-top:0}
  button{padding:12px 16px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;margin:4px;cursor:pointer}
  button:disabled{opacity:.5}
  input{padding:10px;margin:5px 0;width:100%;box-sizing:border-box}
  #status{padding:10px;background:#eee;border-radius:8px;margin:10px 0;white-space:pre-wrap}
  canvas{width:750px;max-width:100%;height:auto;border:1px solid #aaa;image-rendering:pixelated}
  .small{font-size:13px;color:#555}
</style>
</head>
<body>
<div class="wrap">
<h2>E-Paper Flashcard – APPLE</h2>
<div id="status">Chưa kết nối.</div>
<button id="connect">Kết nối nRF52</button>
<button id="send" disabled>Gửi APPLE lên E-Paper</button>
<p class="small">Bản test: 250×128 px, đen trắng, dùng giao thức nRF52 2.13 hiện tại.</p>
<canvas id="preview" width="250" height="128"></canvas>
</div>

<script>
const SERVICE_UUID = "62750001-d828-918d-fb46-b6c11c675aec";
const CHAR_UUID    = "62750002-d828-918d-fb46-b6c11c675aec";
const FW_UUID      = "62750003-d828-918d-fb46-b6c11c675aec";

const CMD_INIT = 0x01;
const CMD_WRITE_IMAGE = 0x30;
const CMD_REFRESH = 0x05;

let device=null, characteristic=null;
let imageChunkSize=128;
let nrf52ModelId=0;

const $ = id => document.getElementById(id);
function log(s){ $("status").textContent += "\n"+s; }
function delay(ms){return new Promise(r=>setTimeout(r,ms));}

function drawCard(){
  const c=$("preview"), ctx=c.getContext("2d");
  ctx.fillStyle="white";
  ctx.fillRect(0,0,250,128);

  ctx.fillStyle="black";
  ctx.textBaseline="alphabetic";

  // LEFT COLUMN — matches the requested physical-device layout
  const leftCenter = 87;

  ctx.textAlign="center";
  ctx.font="bold 24px Arial";
  ctx.fillText("APPLE", leftCenter, 42);

  ctx.font="bold 16px Arial";
  ctx.fillText("quả táo", leftCenter, 61);

  // dashed horizontal separator
  ctx.setLineDash([2,2]);
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(8,69);
  ctx.lineTo(166,69);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.textAlign="left";
  ctx.font="bold 8px Arial";
  ctx.fillText("I eat an apple every day.", 8, 84);
  ctx.fillText("Tôi ăn một quả táo mỗi ngày.", 8, 99);

  // RIGHT COLUMN
  ctx.setLineDash([2,2]);
  ctx.beginPath();
  ctx.moveTo(174,5);
  ctx.lineTo(174,123);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.textAlign="center";

  // Time
  ctx.font="bold 17px Arial";
  ctx.fillText("14:28", 212, 27);

  // rule below time
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(182,35);
  ctx.lineTo(242,35);
  ctx.stroke();

  ctx.font="bold 7px Arial";
  ctx.fillText("SATURDAY", 212, 47);

  ctx.font="bold 25px Arial";
  ctx.fillText("30", 212, 70);

  ctx.font="bold 7px Arial";
  ctx.fillText("AUGUST", 212, 81);

  // rule above year
  ctx.beginPath();
  ctx.moveTo(187,89);
  ctx.lineTo(237,89);
  ctx.stroke();

  ctx.font="bold 8px Arial";
  ctx.fillText("2025", 212, 101);

  ctx.textAlign="left";
}
drawCard();

function canvas2bytes_bw(canvas, type='bw'){
  const ctx=canvas.getContext("2d");
  const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const arr=[];
  let buffer=[];
  for(let x=canvas.width-1;x>=0;x--){
    for(let y=0;y<canvas.height;y++){
      const index=(canvas.width*4*y)+x*4;
      if(type!=='bwr'){
        buffer.push(
          imageData.data[index]>0 &&
          imageData.data[index+1]>0 &&
          imageData.data[index+2]>0 ? 1:0
        );
      }else{
        buffer.push(
          imageData.data[index]>0 &&
          imageData.data[index+1]===0 &&
          imageData.data[index+2]===0 ? 1:0
        );
      }
      if(buffer.length===8){
        arr.push(parseInt(buffer.join(''),2));
        buffer=[];
      }
    }
  }
  return arr;
}

let nrf52ModelDetected = false;
let nrf52PanelProfile = null;
let nrf52DisplayMode = 1;
let nrf52FirmwareVersion = 0;

function notificationHandler(event){
  const value = event.target.value;
  const data = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
  const message = new TextDecoder().decode(data);

  if(message.startsWith("mtu=")){
    const mtu=parseInt(message.substring(4),10);
    if(Number.isFinite(mtu) && mtu>2){
      imageChunkSize=Math.max(18,Math.min(244,mtu-2));
    }
    log("nRF52 "+message+", image chunk: "+imageChunkSize);
    return;
  }

  const isConfig =
    data.length >= 8 &&
    data.length <= 22 &&
    [1,2,3,4,5,7].includes(data[7]);

  if(isConfig){
    nrf52ModelId=data[7];
    nrf52ModelDetected=true;
    nrf52PanelProfile=null;
    if(data.length>11) nrf52DisplayMode=data[11];
    if(nrf52ModelId===2 && data.length>13 && data[13]===0x21){
      nrf52PanelProfile=0x21;
    }
    log("nRF52 model "+nrf52ModelId+
        (nrf52PanelProfile===0x21?", panel: 2.13":"")+
        ", current mode: "+nrf52DisplayMode);
    return;
  }

  log("nRF52 response: "+(message.trim() || bytesToHex(data)));
}

function bytesToHex(data){
  return Array.from(data).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function sendCommand(bytes){
  await characteristic.writeValueWithResponse(new Uint8Array(bytes));
}

async function connect(){
  try{
    $("status").textContent="Đang tìm nRF52...";
    device=await navigator.bluetooth.requestDevice({
      filters:[{services:[SERVICE_UUID]}],
      optionalServices:[SERVICE_UUID]
    });
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    characteristic=await service.getCharacteristic(CHAR_UUID);

    characteristic.addEventListener("characteristicvaluechanged",notificationHandler);
    await characteristic.startNotifications();

    // Exact initialization sequence used by the original controller.
    try{
      const fw=await server.getPrimaryService(SERVICE_UUID).then(s=>s.getCharacteristic(FW_UUID)).then(c=>c.readValue());
      log("Firmware: "+Array.from(new Uint8Array(fw.buffer)).join(","));
      const u=new Uint8Array(fw.buffer);
      if(u.length>0) nrf52FirmwareVersion=u[0];
    }catch(e){log("Không đọc được firmware version.");}

    await sendCommand([CMD_INIT]);
    await delay(100);

    log("Firmware version: "+nrf52FirmwareVersion);
    log("Model: "+(nrf52ModelDetected ? nrf52ModelId : "chưa nhận"));
    log("Panel: "+(nrf52PanelProfile===0x21 ? "2.13 profile 0x21" : "unknown"));
    log("Image chunk: "+imageChunkSize);
    $("status").textContent="Đã kết nối nRF52.";
    $("send").disabled=false;
  }catch(e){
    $("status").textContent="Lỗi: "+e.message;
  }
}

async function sendPlane(bytes,blackPlane=true,planeOffset=0,delayMs=8){
  for(let offset=0;offset<bytes.length;offset+=imageChunkSize){
    const chunk=bytes.slice(offset,offset+imageChunkSize);
    const begin=offset===0 ? 0x00 : 0xf0;
    const plane=blackPlane ? 0x0f : 0x00;
    const packet=new Uint8Array(2+chunk.length);
    packet[0]=CMD_WRITE_IMAGE;
    packet[1]=begin|plane;
    packet.set(chunk,2);
    await characteristic.writeValueWithResponse(packet);
    if(delayMs) await delay(delayMs);
  }
}

async function sendImage(){
  if(!characteristic){alert("Chưa kết nối nRF52.");return;}

  try{
    $("send").disabled=true;
    $("status").textContent="Đang gửi APPLE...";

    // This is intentionally copied from the proven normal nRF52 2.13
    // uploader: INIT -> black plane -> red plane -> REFRESH.
    await sendCommand(new Uint8Array([CMD_INIT]));
    await delay(100);

    const canvas = $("preview");

    // 2.13 / 2.9 firmware stores bytes column-first.
    const black = canvas2bytes_bw(canvas);
    log("Black plane: "+black.length+" bytes");

    // Model 2 2.13 is a BWR panel, so it needs both planes.
    const hasRedPlane = nrf52ModelId === 2;

    await sendPlane(black, true, 0, 8);

    if(hasRedPlane){
      const red = canvas2bytes_bw(canvas, "bwr").map(byte => byte ^ 0xff);
      log("Red plane: "+red.length+" bytes");
      await sendPlane(red, false, 48, 95);
    }else{
      log("Model chưa xác nhận là 2; bỏ qua red plane.");
    }

    // IMPORTANT: do not send SET_TIME/mode here.
    // The official uploader simply refreshes and then marks Picture Mode active.
    await sendCommand(new Uint8Array([CMD_REFRESH]));
    nrf52DisplayMode = 0;

    $("status").textContent="APPLE đã gửi xong.";
    log("nRF52 image uploaded; Picture Mode is now active.");
  }catch(e){
    $("status").textContent="Lỗi gửi: "+e.message;
    log("ERROR: "+e.message);
  }finally{
    $("send").disabled=false;
  }
}

$("connect").onclick=connect;
$("send").onclick=sendImage;
</script>
</body>
</html>
