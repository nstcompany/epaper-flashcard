<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Paper Flashcard</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f3f3f3;font-family:Arial,sans-serif;color:#111}
.card{max-width:760px;margin:auto;background:#fff;border-radius:14px;padding:18px}
h2{margin:0 0 12px}
button{border:0;border-radius:9px;padding:12px 16px;margin:4px;background:#111;color:#fff;font-size:16px}
button:disabled{opacity:.45}
.status{white-space:pre-wrap;background:#eee;border-radius:8px;padding:10px;margin:10px 0;font-family:monospace;font-size:12px}
canvas{display:block;width:750px;max-width:100%;height:auto;margin:12px auto;border:1px solid #aaa;image-rendering:pixelated}
.note{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="card">
<h2>E-Paper Flashcard — APPLE</h2>
<div id="status" class="status">Chưa kết nối.</div>
<button id="connect">Kết nối nRF52</button>
<button id="send" disabled>Gửi APPLE lên E-Paper</button>
<canvas id="canvas" width="148" height="128"></canvas>
<div class="note">148×128 image + 102px firmware clock • nRF52 model 2 • Clock + Image 2.13</div>
</div>

<script>
const NRF52_SERVICE_UUID='62750001-d828-918d-fb46-b6c11c675aec';
const NRF52_CHARACTERISTIC_UUID='62750002-d828-918d-fb46-b6c11c675aec';
const NRF52_APP_VERSION_UUID='62750003-d828-918d-fb46-b6c11c675aec';

const NRF52_CMD_SET_TIME=0x20;
const NRF52_CMD_WRITE_IMAGE=0x30;
const NRF52_CMD_REFRESH=0x05;
const NRF52_CMD_INIT=0x01;
const NRF52_CMD_ACTIVATE=0xa0;
const NRF52_IMAGE_CHUNK_SIZE=128;

let bleDevice=null;
let gattServer=null;
let epdService=null;
let epdCharacteristic=null;

let nrf52DisplayMode=1;
let nrf52ModelId=2;                 // same default as original
let nrf52ModelDetected=false;
let nrf52FirmwareVersion=0;
let nrf52PanelProfile=null;
let nrf52ImageChunkSize=NRF52_IMAGE_CHUNK_SIZE;

let nrf52ActivationWaiter=null;

function waitForActivation(timeoutMs){
  if(nrf52ActivationWaiter){
    clearTimeout(nrf52ActivationWaiter.timer);
    nrf52ActivationWaiter.resolve(null);
  }
  return new Promise(resolve=>{
    const timer=setTimeout(()=>{
      nrf52ActivationWaiter=null;
      resolve(null);
    },timeoutMs);
    nrf52ActivationWaiter={resolve,timer};
  });
}

function resolveActivation(result){
  if(!nrf52ActivationWaiter)return;
  clearTimeout(nrf52ActivationWaiter.timer);
  const waiter=nrf52ActivationWaiter;
  nrf52ActivationWaiter=null;
  waiter.resolve(result);
}

function legacyActivationCode(){
  const name=bleDevice && bleDevice.name ? bleDevice.name : '';
  const match=name.match(/([0-9a-fA-F]{4})$/);
  if(!match)return null;
  const deviceId=parseInt(match[1],16)&0xffff;
  const code=(deviceId^0x7611)&0xffff;
  return code===0xffff?0:code;
}

async function initializeNrf52Device(){
  // Exact activation sequence from the working controller.
  let wait=waitForActivation(1200);
  await sendCommand(new Uint8Array([NRF52_CMD_ACTIVATE]));
  let result=await wait;

  if(result && result.kind==='signed'){
    if(!result.active) throw new Error('nRF52 đang bị khóa; cần signed activation.');
    log('nRF52 activation: active');
    return true;
  }

  if(result && result.kind==='legacy' && result.active){
    log('nRF52 legacy activation: active');
    return true;
  }

  // Open firmware may not answer activation at all.
  if(!result){
    log('nRF52 không trả activation; tiếp tục với firmware open.');
    return true;
  }

  // Legacy UC8176: derive the two-byte key from the Bluetooth name.
  const code=legacyActivationCode();
  if(code===null){
    throw new Error('Không lấy được activation code từ tên Bluetooth.');
  }

  wait=waitForActivation(8000);
  await sendCommand(new Uint8Array([
    NRF52_CMD_ACTIVATE,
    (code>>>8)&0xff,
    code&0xff
  ]));
  result=await wait;

  if(!result || !result.active){
    throw new Error('UC8176 activation thất bại hoặc timeout.');
  }
  log('nRF52 legacy activation: active');
  return true;
}

function delay(ms){return new Promise(r=>setTimeout(r,ms))}
function log(s){document.getElementById('status').textContent += '\n'+s}
function setStatus(s){document.getElementById('status').textContent=s}

async function sendCommand(cmd){
  if(!epdCharacteristic) throw new Error('Bluetooth characteristic chưa sẵn sàng');
  await epdCharacteristic.writeValueWithResponse(cmd);
}

/* EXACT converter used by the original nRF52 2.13/2.9 uploader. */

function thresholdCanvas(src){
  const out=document.createElement('canvas');
  out.width=src.width; out.height=src.height;
  const s=src.getContext('2d');
  const o=out.getContext('2d');
  o.drawImage(src,0,0);
  const d=o.getImageData(0,0,out.width,out.height);
  for(let i=0;i<d.data.length;i+=4){
    const y=(d.data[i]*299+d.data[i+1]*587+d.data[i+2]*114)/1000;
    const v=y<190?0:255;
    d.data[i]=v; d.data[i+1]=v; d.data[i+2]=v; d.data[i+3]=255;
  }
  o.putImageData(d,0,0);
  return out;
}

function canvas2bytes_bw(canvas,type='bw'){
  const ctx=canvas.getContext('2d');
  const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const arr=[];
  let buffer=[];
  for(let x=canvas.width-1;x>=0;x--){
    for(let y=0;y<canvas.height;y++){
      const index=(canvas.width*4*y)+x*4;
      if(type!=='bwr'){
        buffer.push(
          imageData.data[index]>0 &&
          imageData.data[index+1]>0 &&
          imageData.data[index+2]>0 ? 1:0
        );
      }else{
        buffer.push(
          imageData.data[index]>0 &&
          imageData.data[index+1]===0 &&
          imageData.data[index+2]===0 ? 1:0
        );
      }
      if(buffer.length===8){
        arr.push(parseInt(buffer.join(''),2));
        buffer=[];
      }
    }
  }
  return arr;
}

/* EXACT packet format used by the original controller. */
async function sendNrf52ImagePlane(data,blackPlane){
  const chunkSize=nrf52ImageChunkSize;
  const total=Math.ceil(data.length/chunkSize);
  for(let offset=0,part=0;offset<data.length;offset+=chunkSize,part++){
    const chunk=data.slice(offset,offset+chunkSize);
    const begin=offset===0?0x00:0xf0;
    const plane=blackPlane?0x0f:0x00;
    const packet=new Uint8Array([NRF52_CMD_WRITE_IMAGE,begin|plane,...chunk]);
    await sendCommand(packet);
    if(part===0 || part===total-1 || part%10===0)
      log(`plane ${blackPlane?'black':'red'} ${part+1}/${total}`);
    await delay(8);
  }
}

/* Exact notification handling from the original controller. */
function handleNrf52Notification(event){
  const value=event.target.value;
  const data=new Uint8Array(value.buffer,value.byteOffset,value.byteLength);

  const message=new TextDecoder().decode(data);

  if(data.length===15 && data[0]===NRF52_CMD_ACTIVATE){
    const code=String.fromCharCode(...data.slice(11,15));
    const active=data[2]!==0;
    log(`nRF52 activation: ${active?'active':'locked'}, device ${code}`);
    resolveActivation({kind:'signed',active});
    return;
  }


  if(message.startsWith('activation=ok')){
    log('nRF52 legacy activation: active');
    resolveActivation({kind:'legacy',active:true});
    return;
  }
  if(message.startsWith('activation=locked')){
    log('nRF52 legacy activation: locked');
    resolveActivation({kind:'legacy',active:false});
    return;
  }

  if(message.startsWith('mtu=')){
    const mtu=parseInt(message.substring(4),10);
    if(Number.isFinite(mtu)&&mtu>2)
      nrf52ImageChunkSize=Math.max(18,Math.min(244,mtu-2));
    log(`nRF52 ${message}, image chunk: ${nrf52ImageChunkSize} bytes`);
    return;
  }

  const isConfig=data.length>=8 && data.length<=22 &&
    [1,2,3,4,5,7].includes(data[7]);

  if(isConfig){
    nrf52ModelId=data[7];
    nrf52ModelDetected=true;
    nrf52PanelProfile=null;
    if(data.length>11)nrf52DisplayMode=data[11];
    if(nrf52ModelId===2 && data.length>13 && data[13]===0x21)
      nrf52PanelProfile=0x21;

    log(`nRF52 model ${nrf52ModelId}`+
      (nrf52PanelProfile===0x21?', panel: 2.13':'')+
      `, current mode: ${nrf52DisplayMode}`);
    return;
  }

  log('nRF52 response: '+(message.trim()||Array.from(data).map(x=>x.toString(16).padStart(2,'0')).join('')));
}

/*
 * Exact normal full-screen uploader from the original source:
 * INIT -> black -> optional red -> REFRESH.
 */
async function uploadNrf52Image(){
  const canvas=document.getElementById('canvas');

  if(canvas.width!==250 || canvas.height!==128)
    throw new Error('Canvas phải là 250×128.');

  await sendCommand(new Uint8Array([NRF52_CMD_INIT]));
  await delay(100);

  const black=canvas2bytes_bw(canvas);

  const hasRedPlane=(nrf52ModelId===2);

  log(`black=${black.length} bytes`);
  await sendNrf52ImagePlane(black,true,0,hasRedPlane?48:95);

  if(hasRedPlane){
    const red=canvas2bytes_bw(canvas,'bwr').map(byte=>byte^0xff);
    log(`red=${red.length} bytes`);
    await sendNrf52ImagePlane(red,false,48,95);
  }

  await sendCommand(new Uint8Array([NRF52_CMD_REFRESH]));
  nrf52DisplayMode=0;
  log('nRF52 image uploaded; Picture Mode is now active.');
}


async function sendNrf52ModeExact(mode){
  // This mirrors the original controller's sendNrf52Mode().
  const timestamp=Math.floor(Date.now()/1000);
  const timezoneHours=Math.round(-new Date().getTimezoneOffset()/60);
  const packet=new Uint8Array([
    NRF52_CMD_SET_TIME,
    (timestamp>>>24)&0xff,
    (timestamp>>>16)&0xff,
    (timestamp>>>8)&0xff,
    timestamp&0xff,
    timezoneHours&0xff,
    mode&0xff
  ]);
  await sendCommand(packet);
  nrf52DisplayMode=mode&0x7f;
}

function drawFlashcard(){
  const c=document.getElementById('canvas');
  const ctx=c.getContext('2d');

  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,148,128);
  ctx.fillStyle='#000';
  ctx.textBaseline='alphabetic';

  // Left image area is exactly 148x128; firmware supplies the right 102px.
  ctx.textAlign='center';

  ctx.font='900 23px Arial Black, Arial, sans-serif';
  ctx.fillText('APPLE',74,38);

  ctx.font='900 13px Arial Black, Arial, sans-serif';
  ctx.fillText('quả táo',74,58);

  ctx.setLineDash([2,2]);
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(6,68);
  ctx.lineTo(142,68);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.textAlign='left';
  ctx.font='900 8px Arial Black, Arial, sans-serif';
  ctx.fillText('I eat an apple every day.',6,83);
  ctx.fillText('Tôi ăn một quả táo mỗi ngày.',6,98);
}
drawFlashcard();

async function connect(){
  try{
    setStatus('Đang tìm nRF52...');

    bleDevice=await navigator.bluetooth.requestDevice({
      filters:[{services:[NRF52_SERVICE_UUID]}],
      optionalServices:[NRF52_SERVICE_UUID]
    });

    gattServer=await bleDevice.gatt.connect();
    log('GATT server found');

    epdService=await gattServer.getPrimaryService(NRF52_SERVICE_UUID);
    epdCharacteristic=await epdService.getCharacteristic(NRF52_CHARACTERISTIC_UUID);

    try{
      const appVersionCharacteristic=
        await epdService.getCharacteristic(NRF52_APP_VERSION_UUID);
      const v=await appVersionCharacteristic.readValue();
      nrf52FirmwareVersion=v.getUint8(0);
      log(`nRF52 firmware version: ${nrf52FirmwareVersion}`);
    }catch(e){
      log('Không đọc được firmware version.');
    }

    /* EXACT order from original: listener BEFORE startNotifications. */
    epdCharacteristic.addEventListener(
      'characteristicvaluechanged',
      handleNrf52Notification
    );
    await epdCharacteristic.startNotifications();

    /* Exact original controller order: activate first, then initialize. */
    await initializeNrf52Device();
    await sendCommand(new Uint8Array([NRF52_CMD_INIT]));
    await delay(100);

    log('nRF52 connected; display initialized.');
    log(`Model=${nrf52ModelId}, panel=${nrf52PanelProfile===0x21?'2.13':'unknown'}, chunk=${nrf52ImageChunkSize}`);

    setStatus('Đã kết nối nRF52.');
    document.getElementById('send').disabled=false;
  }catch(e){
    setStatus('Lỗi: '+(e.message||e));
  }
}

async function sendImage(){
  if(!epdCharacteristic){alert("Chưa kết nối nRF52.");return;}

  try{
    document.getElementById('send').disabled=true;
    setStatus('Đang gửi APPLE bằng Clock + Image mode...');

    /*
     * EXACT firmware-supported path for:
     * model 2 + 2.13 panel profile 0x21 + firmware v40+
     *
     * Target:
     *   image = 148x128 on the left
     *   clock/calendar = 102px on the right
     *   mode = 0x83
     *   full frame = 250x128 = 4000 bytes/plane
     */

    if(nrf52ModelDetected && nrf52ModelId!==2){
      throw new Error('Thiết bị không phải nRF52 model 2.');
    }
    if(nrf52FirmwareVersion && nrf52FirmwareVersion<40){
      throw new Error('Firmware cần v40+ cho Clock + Image 2.13.');
    }
    if(nrf52PanelProfile!==null && nrf52PanelProfile!==0x21){
      throw new Error('Panel không phải profile 2.13 (0x21).');
    }

    // Original clock-image uploader initializes the controller first.
    await sendCommand(new Uint8Array([NRF52_CMD_INIT]));
    await delay(150);

    // Build the exact 250x128 full-frame from the 148x128 image canvas.
    const full=document.createElement('canvas');
    full.width=250;
    full.height=128;
    const fctx=full.getContext('2d');
    fctx.fillStyle='#fff';
    fctx.fillRect(0,0,250,128);

    // Make all text pixels strictly black/white before the original
    // converter sees them. This is critical for small 148x128 fonts.
    const cleanLeft=thresholdCanvas(document.getElementById('canvas'));
    fctx.drawImage(cleanLeft,0,0);

    // Exact original ssd1680ClockImageToFullPlanes conversion.
    const black=canvas2bytes_bw(full);
    const red=canvas2bytes_bw(full,'bwr').map(byte=>byte^0xff);

    if(black.length!==4000 || red.length!==4000){
      throw new Error(`Sai kích thước full frame: ${black.length}/${red.length}, cần 4000/4000.`);
    }

    log('Clock+Image full frame: 250x128 = 4000 bytes/plane.');

    // Exact original clock-image upload sequence.
    await sendNrf52ImagePlane(black,true,5,46);
    await sendNrf52ImagePlane(red,false,46,87);

    // The critical difference: Face 2 / clock mode is selected ONLY AFTER
    // both planes are written. Firmware then draws the clock over the right
    // 102px and performs the final refresh.
    const timestamp=Math.floor(Date.now()/1000);
    const timezoneHours=Math.round(-new Date().getTimezoneOffset()/60);
    const modePacket=new Uint8Array([
      NRF52_CMD_SET_TIME,
      (timestamp>>>24)&0xff,
      (timestamp>>>16)&0xff,
      (timestamp>>>8)&0xff,
      timestamp&0xff,
      timezoneHours&0xff,
      0x83
    ]);
    await sendCommand(modePacket);

    nrf52DisplayMode=0x83;
    log('Clock + Image mode 0x83 sent. Waiting for firmware refresh...');
    await delay(12000);

    setStatus('APPLE đã gửi xong — Clock + Image mode.');
    log('Hoàn tất: ảnh 148x128 bên trái, clock/calendar firmware bên phải.');
  }catch(e){
    setStatus('Lỗi gửi: '+(e.message||e));
    log('ERROR: '+(e.message||e));
  }finally{
    document.getElementById('send').disabled=false;
  }
}

document.getElementById('connect').onclick=connect;
document.getElementById('send').onclick=sendImage;
</script>
</body>
</html>
